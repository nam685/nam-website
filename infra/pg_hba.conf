# Custom pg_hba.conf for nam-website's Postgres container.
#
# The stock postgres:16 image's initdb always generates "trust" for local
# (unix socket) and 127.0.0.1/::1 connections, regardless of
# POSTGRES_HOST_AUTH_METHOD -- that env var only controls the one extra
# "host all all all ..." line the entrypoint appends for non-local
# addresses. That meant any local process (including sandboxed users like
# klaude, or a compromised process on the host) could connect as any
# Postgres role without a password. See GitHub issue #298.
#
# This file is bind-mounted over $PGDATA/pg_hba.conf to require the real
# POSTGRES_PASSWORD for every connection, local or not.

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# "local" is for Unix domain socket connections only
local   all             all                                     scram-sha-256
# IPv4 local connections:
host    all             all             127.0.0.1/32            scram-sha-256
# IPv6 local connections:
host    all             all             ::1/128                 scram-sha-256
# Allow replication connections from localhost, by a user with the
# replication privilege.
local   replication     all                                     scram-sha-256
host    replication     all             127.0.0.1/32            scram-sha-256
host    replication     all             ::1/128                 scram-sha-256

host    all             all             all                     scram-sha-256
